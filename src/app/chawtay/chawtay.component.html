<div *ngIf="customerData" 
     class="min-h-screen flex items-center justify-center p-6 overflow-hidden relative"
     [style.backgroundColor]="customerData.themeColor + '10'">
  
  <div class="z-10 bg-white/90 backdrop-blur-sm p-8 rounded-[2.5rem] shadow-2xl border-2 max-w-sm w-full text-center"
       [style.borderColor]="customerData.themeColor + '30'">
    
    <div *ngIf="!isAccepted">
      <div class="mb-6 relative inline-block">
        <img [src]="customerData.askingImage" class="w-44 h-44 mx-auto rounded-3xl object-cover shadow-md border-4 border-white">
        <div class="absolute -bottom-2 -right-2 bg-white rounded-full p-2 shadow-sm text-2xl">🥺</div>
      </div>

      <h1 class="text-2xl font-bold mb-8" [style.color]="customerData.themeColor">
        {{ customerData.mainQuestion }}
      </h1>

      <div class="flex flex-col items-center gap-5">
        <button (click)="onYesClick()" [style.transform]="'scale(' + yesScale + ')'"
          [style.backgroundColor]="customerData.themeColor"
          class="text-white px-10 py-3.5 rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition-all">
          မကောက်တော့ဘူး (Yes)
        </button>
        <button (click)="onNoClick()" class="no-btn text-gray-400 text-sm font-medium underline">
          {{ currentNoText }}
        </button>
      </div>
    </div>

    <div *ngIf="isAccepted" class="success-content">
      <img [src]="customerData.successImage" class="w-40 h-40 mx-auto mb-6 rounded-full border-4 shadow-xl p-1 bg-white"
           [style.borderColor]="customerData.themeColor + '40'">
      
      <h2 class="text-2xl font-black mb-1" [style.color]="customerData.themeColor">
        {{ customerData.successMessage }}
      </h2>
      <p class="text-gray-500 mb-6 italic text-sm">{{ customerData.giftText }}</p>
      
      <div class="rounded-2xl overflow-hidden shadow-inner border border-gray-100 bg-gray-50/50 p-2">
        <div class="aspect-video rounded-lg overflow-hidden border-2 border-white shadow-sm mb-4 bg-black">
          <video 
            class="w-full h-full object-cover"
            [src]="customerData.videoUrl"
            autoplay 
            loop
            playsinline
            controls>
          </video>
        </div>

        <a [href]="customerData.videoUrl" 
           [download]="customerData.name + '-surprise.mp4'"
           class="inline-flex items-center justify-center gap-2 w-full text-white px-4 py-3 rounded-xl text-sm font-bold active:scale-95 shadow-md"
           [style.backgroundColor]="customerData.themeColor">
           <span>⬇️ Download Video</span>
        </a>
      </div>
      
      <p class="mt-6 text-xs text-gray-300">Created with love 💙</p>
    </div>
  </div>
</div>
