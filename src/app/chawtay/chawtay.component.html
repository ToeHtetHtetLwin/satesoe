<div *ngIf="customerData" 
     class="min-h-screen flex items-center justify-center p-4 overflow-hidden relative transition-colors duration-700"
     [style.backgroundColor]="customerData.themeColor + '10'">
  
  <div class="z-10 bg-white/95 backdrop-blur-md p-5 rounded-[2.5rem] shadow-2xl border-2 w-full max-w-[310px] text-center mx-auto"
       [style.borderColor]="customerData.themeColor + '20'">
    
    <div *ngIf="!isAccepted" class="py-4">
      <div class="mb-6 relative inline-block">
        <img [src]="customerData.askingImage" class="w-36 h-36 mx-auto rounded-3xl object-cover shadow-md border-4 border-white">
      </div>
      <h1 class="text-xl font-bold mb-8 px-2" [style.color]="customerData.themeColor">
        {{ customerData.mainQuestion }}
      </h1>
      <div class="flex flex-col items-center gap-4">
        <button (click)="onYesClick()" [style.transform]="'scale(' + yesScale + ')'"
                [style.backgroundColor]="customerData.themeColor"
                class="text-white px-8 py-3.5 rounded-2xl font-bold text-lg shadow-lg w-full max-w-[200px]">
          မကောက်တော့ဘူး
        </button>
        <button (click)="onNoClick()" class="no-btn text-gray-400 text-sm underline">
          {{ currentNoText }}
        </button>
      </div>
    </div>

    <div *ngIf="isAccepted" class="success-content flex flex-col items-center w-full">
      
      <div class="relative inline-block mb-3">
        <img [src]="customerData.successImage" class="w-20 h-20 rounded-full border-4 shadow-lg p-1 bg-white object-cover"
             [style.borderColor]="customerData.themeColor + '40'">
      </div>
      
      <h2 class="text-xl font-black mb-1" [style.color]="customerData.themeColor">
        {{ customerData.successMessage }}
      </h2>
      <p class="text-gray-500 mb-4 italic text-[12px] px-2 leading-snug">{{ customerData.giftText }}</p>
      
      <div class="w-full rounded-[2rem] overflow-hidden border border-gray-100 bg-gray-50/50 p-2 flex flex-col items-center shadow-inner">
        <p class="text-[9px] text-gray-400 font-bold uppercase tracking-[0.2em] mb-2">Surprise for you</p>
        
        <div class="aspect-[9/16] w-full max-w-[230px] max-h-[400px] rounded-2xl overflow-hidden border-2 border-white shadow-md bg-black flex items-center justify-center">
          <video 
            class="w-full h-full object-contain"
            [src]="customerData.videoUrl"
            autoplay 
            loop
            playsinline
            controls>
          </video>
        </div>

        <a [href]="customerData.videoUrl" 
           [download]="customerData.name + '-gift.mp4'"
           class="mt-3 inline-flex items-center justify-center gap-2 w-full max-w-[230px] text-white px-4 py-3 rounded-xl text-xs font-bold active:scale-95 shadow-md transition-all"
           [style.backgroundColor]="customerData.themeColor">
           <span>⬇️ ဗီဒီယိုလေး သိမ်းထားမယ်</span>
        </a>
      </div>
      
      <p class="mt-4 text-[9px] text-gray-300 tracking-widest uppercase font-semibold">Created with Love 💙</p>
    </div>
  </div>
</div>
